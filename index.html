:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e0c0b;--ink:#f6efe6;--mute:#a79a8d}}
:root[data-theme="dark"]{--bg:#0e0c0b;--ink:#f6efe6;--mute:#a79a8d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.brand{font-family:var(--serif);font-weight:800;font-size:1.2rem}
.sub{background:var(--ember);color:#fff;font-weight:600;padding:10px 20px;border-radius:999px;font-size:.95rem}
.scene{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(var(--a),var(--b))}
.scene::before{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:var(--r1);clip-path:polygon(0 100%,0 55%,14% 28%,26% 50%,41% 12%,56% 46%,70% 22%,84% 48%,100% 30%,100% 100%);z-index:-1}
.scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;background:var(--r2);clip-path:polygon(0 100%,0 62%,18% 40%,34% 64%,52% 30%,68% 60%,86% 38%,100% 58%,100% 100%);z-index:-1}
.sun{position:absolute;width:20%;aspect-ratio:1;border-radius:50%;background:var(--sun);right:16%;top:14%;filter:blur(2px);z-index:-2;box-shadow:0 0 70px 24px var(--sun)}
.play{position:absolute;left:50%;top:44%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.play::before{content:"";border-left:20px solid #1a1512;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.feature{display:block;border-radius:22px;aspect-ratio:16/8.5;margin-bottom:12px}
.feature .play{width:84px;height:84px;margin:-42px 0 0 -42px}
.cap{position:absolute;left:0;right:0;bottom:0;padding:70px 28px 26px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff}
.cap small{display:inline-block;background:var(--gold);color:#1a1512;font-weight:600;padding:3px 12px;border-radius:999px;margin-bottom:10px}
.cap h1{font-family:var(--serif);font-weight:800;font-size:clamp(1.9rem,6vw,3.6rem);line-height:1.05;margin:0 0 6px;max-width:16ch}
.cap p{margin:0;font-size:1.05rem;opacity:.92}
.tabs{display:flex;gap:22px;margin:34px 0 18px;border-bottom:1px solid color-mix(in srgb,var(--ink) 18%,transparent)}
.tab{font:inherit;font-weight:600;font-size:1.05rem;background:none;border:0;color:var(--mute);padding:8px 0;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ember)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px 20px;padding-bottom:48px}
.card{display:block}
.card .scene{aspect-ratio:16/9;border-radius:16px;transition:transform .2s}
.card:hover .scene{transform:scale(1.025)}
.card h3{font-family:var(--serif);font-weight:600;font-size:1.2rem;line-height:1.25;margin:12px 0 2px}
.card p{margin:0;color:var(--mute);font-size:.92rem}
.tag{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.6);color:#fff;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px}
.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.scene.photo::before,.scene.photo::after{display:none}
.feature.photo{aspect-ratio:16/9}
.feature.photo .cap{top:0;bottom:auto;padding:18px 22px;background:linear-gradient(rgba(0,0,0,.65),transparent)}
.feature.photo .cap h1,.feature.photo .cap p{display:none}
.feature.photo .cap small{margin:0}
.mh{font-family:var(--serif);font-weight:800;font-size:1.5rem;margin:30px 0 14px}
.end{text-align:center;padding:56px 20px 40px;border-top:1px solid color-mix(in srgb,var(--ink) 18%,transparent)}
.end h2{font-family:var(--serif);font-weight:800;font-size:clamp(1.7rem,4.5vw,2.6rem);margin:0 0 18px}
.end .sub{display:inline-block;padding:14px 30px;font-size:1.05rem}
footer{text-align:center;color:var(--mute);font-size:.88rem;padding-bottom:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
